name: Deploy Azure App Service

on:
  workflow_dispatch:

concurrency:
  group: deploy-azure-appservice-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build and Deploy to Azure Web App
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NEXT_TELEMETRY_DISABLED: "1"
      AZURE_WEBAPP_NAME: Portal-ChatBot
      AZURE_RESOURCE_GROUP: agente-chat

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore Next.js cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('package-lock.json', 'package.json', 'next.config.ts', 'src/**', 'public/**', 'scripts/prepare-azure-package.mjs') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('package-lock.json', 'package.json') }}-

      - name: Install dependencies
        run: npm ci --no-audit --prefer-offline

      - name: Build standalone package
        run: npm run package:azure

      - name: Create deployment zip
        run: |
          cd dist/azure-appservice
          zip -qr ../azure-appservice.zip .

      - name: Login to Azure with OIDC
        id: azure_login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure App Service is stopped
        run: |
          az webapp stop \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME"

      - name: Deploy clean package to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          resource-group-name: ${{ env.AZURE_RESOURCE_GROUP }}
          package: dist/azure-appservice.zip
          type: zip
          target-path: /home/site/wwwroot
          clean: true
          restart: false

      - name: Keep App Service stopped
        if: ${{ always() && steps.azure_login.outcome == 'success' }}
        run: |
          az webapp stop \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME"
