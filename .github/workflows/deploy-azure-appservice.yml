name: Deploy Azure App Service

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: deploy-azure-appservice-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build and Deploy to Azure Web App
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore Next.js cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('package-lock.json', 'package.json', 'next.config.ts', 'src/**', 'public/**', 'scripts/prepare-azure-package.mjs') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('package-lock.json', 'package.json') }}-

      - name: Install dependencies
        run: npm ci --no-audit --prefer-offline

      - name: Build standalone package
        run: npm run package:azure

      - name: Create deployment zip
        run: |
          cd dist/azure-appservice
          zip -qr ../azure-appservice.zip .

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: dist/azure-appservice.zip
